            justify-content: center;
        }

            padding: 10px 20px;

            border-radius: 8px;
            background-color: #ffffff;
            color: var(--primary-dark);
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);

            transform: translateY(-2px);
            opacity: 0.9;
        }

        .nav-btn.active {
            background-color: var(--accent-blue);
            color: white;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            padding: 10px;
        }

        .flashcard {
            background-color: transparent;
            height: 240px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: var(--shadow);
            border-radius: 12px;
        }

        .flashcard:hover .card-inner {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 12px;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .card-front {
            background-color: var(--card-front);
            color: var(--text-color);
            border-top: 6px solid var(--accent-blue);
        }

        .card-back {
            background-color: var(--card-back);
            color: var(--text-color);
            transform: rotateY(180deg);
            border-top: 6px solid #94a3b8;
            overflow-y: auto;
        }

        .category-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 4px 10px;
            border-radius: 20px;
            color: white;
        }

        .tag-data { background-color: var(--topic-data); }
        .tag-env { background-color: var(--topic-env); }
        .tag-security { background-color: var(--topic-security); }

            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary-dark);
            line-height: 1.5;
            margin: auto 0;

            line-height: 1.6;
            color: #334155;
            margin: auto 0;
            text-align: left;
            width: 100%;
        }

            font-size: 0.75rem;
            color: #94a3b8;

            color: #64748b;

            font-style: italic;
        }

                grid-template-columns: 1fr;
            }
        }

</head>

        function displayCards(filterTopicId) {
            const gridContainer = document.getElementById('grid');
            gridContainer.innerHTML = '';

            const filteredData = filterTopicId === 'all' 
                ? flashcardsData 
                : flashcardsData.filter(item => item.topic === filterTopicId);

            filteredData.forEach(data => {
                const cardElement = document.createElement('div');
                cardElement.className = 'flashcard';
                
                cardElement.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <span class="category-tag ${data.tagClass}">${data.category}</span>
                            <p class="card-question">${data.question}</p>
                            <span class="hint-text">🔄 Click to Reveal Answer</span>
                        </div>
                        <div class="card-back">
                            <span class="category-tag" style="background-color: #64748b;">Answer Definition</span>
                            <p class="card-answer">${data.answer}</p>
                            <span class="citation">${data.citation}</span>
                            <span class="hint-text" style="margin-top: 5px;">🔄 Click to Return</span>
                        </div>
                    </div>
                `;

                cardElement.addEventListener('click', () => {
                    const inner = cardElement.querySelector('.card-inner');
                    inner.classList.toggle('flipped');
                });

                gridContainer.appendChild(cardElement);
            });
        }

        function filterTopic(topicId) {
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // Highlight matching button
            const targetBtn = Array.from(buttons).find(btn => btn.getAttribute('onclick').includes(`'${topicId}'`));
            if (targetBtn) targetBtn.classList.add('active');

            displayCards(topicId);
        }

        // Initialize display with all cards
        window.onload = () => {
            displayCards('all');
        };
    </script>
